defaults:
  - _self_
  - dataset: beaver_tails
  - override hydra/launcher: submitit_slurm
  # - override hydra/sweeper: optuna
exp_ident: polytope_hb
model_path: None
rejection_logit_path: None
batch_size: 128
seed: 42
learning_rate: 0.01
# Model type: either 'polytope' or 'mlp'
model_type: polytope
# Polytope-specific parameters
entropy_weight: 1.0
valid_edges_threshold: 0.0
unsafe_weight: 2.0
use_nonlinear: false
use_neural_phi: false
phi_hidden_dim: 512
neural_phi_architecture: mlp2
neural_phi_hidden_dims:
  - 512
entropy_assignment: true
feature_dim: 16384
f_l1_weight: 1.0
phi_l1_weight: 0.0001
margin: 1.0
safe_margin: null
unsafe_margin: null
loss_type: relu  # Options: "relu", "softplus", "smooth_hinge"
# Descent loss parameters
desc_loss_weight: 0.0
control_radius: 1.0
cbf_k: 1.0
log_interval: 100
neural_phi_final_activation: null  # Options: null, "tanh", "softsign"
# Steering vector parameters (ActAdd/DirAblate baselines)
steering_method: null    # Options: null, "actadd", "dirablate"
steering_alpha: 1.0      # Steering strength (ActAdd only)
steering_normalize: true # Whether to normalize steering vector to unit length

hydra:
  run:
    dir: outputs/${dataset.short_name}/${now:%Y-%m-%d}/${exp_ident}-${now:%H-%M-%S}
  sweep:
    dir: multirun/${dataset.short_name}/${now:%Y-%m-%d}/${exp_ident}-${now:%H-%M-%S}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    timeout_min: 1440
    cpus_per_task: 1
    tasks_per_node: 1
    nodes: 1
    name: ${exp_ident}
    _target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
    additional_parameters: {"gpus": "titan_rtx:1"}
    mem_per_cpu: 128G
    setup:
      - '#SBATCH --requeue'
