defaults:
  - override hydra/launcher: submitit_slurm

dataset: mt_bench
exp_ident: eval_mtbench

model_path: null
custom_adapter_path: null
model_id: null

use_safe_rep_model: false
polytope_weight_path: null
projection: false
use_backup_response: false
steer_layer: 20
lambda_weight: 1.0
steer_first_n_tokens: 20
safe_violation_weight: 0.0001
steering_method: null

use_cbf: false
cbf_mode: "estimated"
cbf_dt: 1.0
cbf_k: 1.0
cbf_w: 1.0
cbf_p: 10.0
cbf_kappa: 10.0
cbf_max_constraints: 2
cbf_constraint_mode: "topk"

use_defense: false
defense_method: backtranslation

use_reft_r1: false
reft_r1_vector_path: null
reft_r1_target_layer: 20
reft_r1_top_k: 8
reft_r1_beta: 1.0

mtbench_question_file: third_party/FastChat/fastchat/llm_judge/data/mt_bench/question.jsonl
mtbench_reference_answer_dir: third_party/FastChat/fastchat/llm_judge/data/mt_bench/reference_answer
judge_prompt_file: third_party/FastChat/fastchat/llm_judge/data/judge_prompts.jsonl
mtbench_answer_path: null
mtbench_judgment_path: null
mtbench_summary_path: null

run_judge: true
judge_model: gpt-4
judge_request_model: openai/gpt-4o-mini
judge_api_base: https://openrouter.ai/api/v1
judge_api_key_env: OPENROUTER_API_KEY
judge_parallel: 1

seed: 42
question_begin: null
question_end: null
num_choices: 1
batch_size: 1
max_input_length: 2048
max_new_tokens: 1024
do_sample: false
temperature_override: null
top_p: 0.95
device_map: auto

hydra:
  run:
    dir: outputs/mtbench/logs/${now:%Y-%m-%d}/${exp_ident}-${now:%H-%M-%S}
  job:
    chdir: false
  sweep:
    dir: multirun/mtbench/${now:%Y-%m-%d}/${exp_ident}-${now:%H-%M-%S}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    timeout_min: 1440
    cpus_per_task: 8
    tasks_per_node: 1
    nodes: 1
    name: ${exp_ident}
    _target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
    additional_parameters: {"gpus": "a100_80gb:1"}
    setup:
      - '#SBATCH --requeue'
