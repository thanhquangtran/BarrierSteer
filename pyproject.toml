[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "barriersteer"
version = "0.1.0"
description = "BarrierSteer: LLM Safety via Learning Barrier Steering"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "MIT"
authors = [{ name = "BarrierSteer authors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "accelerate==1.12.0",
  "datasets==2.20.0",
  "hydra-core==1.3.2",
  "hydra-submitit-launcher==1.2.0",
  "hf-transfer>=0.1.4",
  "lm-eval>=0.4.0",
  "nltk==3.9.1",
  "omegaconf==2.3.0",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scikit-learn==1.6.1",
  "scipy==1.15.2",
  "seaborn==0.13.2",
  "tqdm==4.66.4",
  "tueplots==0.0.17",
  "umap-learn==0.5.6",
  # Model stack. vLLM 0.6.3.post1 is tied to torch 2.4.0 in the SAP env.
  "torch==2.4.0",
  "torchvision==0.19.0",
  "transformers==4.57.6",
  "tokenizers==0.22.2",
  "vllm==0.6.3.post1",
  "xformers==0.0.27.post2",
  "bitsandbytes==0.49.1",
  "peft==0.18.1",
  "sentencepiece==0.2.1",
  "sentence-transformers==5.2.0",
  # HarmBench APIs / baselines.
  "fschat==0.2.36",
  "ray==2.53.0",
  "openai==2.15.0",
  "anthropic==0.76.0",
  "mistralai==1.10.0",
  "google-generativeai==0.8.6",
  "google-cloud-aiplatform==1.133.0",
  "datasketch==1.8.0",
  "art==6.5",
  "tenacity==9.1.2",
  "boto3==1.42.28",
  # Defended-target baselines used by HarmBench/generate_completions.py.
  "llm-jailbreaking-defense",
  # Misc packages present in SAP and required by optional evaluation paths.
  "spacy==3.7.2",
  "confection==0.1.4",
  "matplotlib==3.10.8",
  "tensorflow==2.20.0",
  "tf-keras>=2.20.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "black>=23.1.0",
  "isort>=5.12.0",
  "flake8>=6.0.0",
  "pre-commit>=3.0.0",
]
spacy-models = [
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
llm-jailbreaking-defense = { path = "third_party/llm-jailbreaking-defense", editable = true }

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
