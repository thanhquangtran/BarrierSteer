          steering_method: "actadd"
          steering_alpha: 1.0
          steering_normalize: false

        dirablate:
          base_exp_ident_suffix: "dirablate"
          model_type: "steering_vector"
          steering_method: "dirablate"
          steering_alpha: 1.0
          steering_normalize: false

        cbf_topk_nonlinear:
          base_exp_ident_suffix: "cbf_topk_nonlinear"
          model_type: "polytope"
          num_phi: [4]
          use_neural_phi: true
          use_nonlinear: false
          neural_phi_architecture: separate_networks
          neural_phi_hidden_dims: [2048, 1024, 512, 256]
          lambda_constraint: 0.0
          desc_loss_weight: 0.0
          control_radius: 10000.0
          cbf_k: 1.0
          safe_margin: 0.0
          unsafe_margin: 0.5
          unsafe_weight: 5.0

        cast_actadd:
          base_exp_ident_suffix: "cast_actadd"
          model_type: "conditional_steering_vector"
          num_phi: [4]
          reuse_weights_from: "cbf_topk_nonlinear"
          reuse_steering_vector_from: "actadd"
          steering_method: "actadd"
          steering_alpha: 1.0
          steering_normalize: false
        cast_dirablate:
          base_exp_ident_suffix: "cast_dirablate"
