          cbf_k: 1.0
          safe_margin: 0.0
          unsafe_margin: 0.5
          unsafe_weight: 5.0
          steering_method: "dirablate"
          steering_alpha: 1.0
          steering_normalize: false
        circuit_breaker:
          model_type: "circuit_breaker"
          base_exp_ident_suffix: "circuit_breaker"
          base_output_dir: "${WORKSPACE_ROOT}/outputs/harmbench_cb/mistral_8b"
          behavior_dataset: "data/behavior_datasets/harmbench_behaviors_text_val.csv"
          target_layers: "20"
          transform_layers: "-1"
          lorra_alpha: 10.0
