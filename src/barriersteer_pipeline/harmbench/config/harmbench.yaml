# HarmBench Pipeline Configuration
pipeline:
  name: "harmbench_experiment"
  output_dir: "./outputs/harmbench_experiments"
  harmbench_path: "${WORKSPACE_ROOT}/HarmBench"
  barriersteer_path: "${WORKSPACE_ROOT}"
  # HarmBench run_pipeline.py settings
  base_save_dir: "./results"
  base_log_dir: "./slurm_logs"
  cls_path: "cais/HarmBench-Llama-2-13b-cls"
  starting_batch_size: 16  # Project default for Stage 4 generation; override only for measured memory constraints
  vllm_gpu_memory_utilization: 0.7  # Use 70% of GPU memory
  vllm_enforce_eager: true          # Disable CUDA graphs to save memory
  vllm_max_num_seqs: 64             # Reduce concurrency
  # Optional Stage 3/4 mode selection. Leave commented/empty to run every configured mode.
  # These can also be supplied on the CLI with --mode-types and --modes.
  # mode_types: ["circuit_breaker"]  # e.g. circuit_breaker, reft_r1, polytope, base_model, defense
  # modes: ["circuit_breaker"]      # exact configured mode names

# Models to test
models:
  - name: "llama2_7b"
    path: "meta-llama/Llama-2-7b-chat-hf"
    hidden_state_layer: 20
    steering:
      modes:
        sap:
          base_exp_ident_suffix: "sap"
          num_phi: [30]  # Ablation study: test multiple num_phi values
          cbf:
            use: false
        cbf_topk_nonlinear:
          base_exp_ident_suffix: "cbf_topk_nonlinear"
          num_phi: [4]  # Ablation study: test multiple num_phi values
          cbf:
            use: true
            mode: "estimated"
            dt: 1.0
            k: 1.0
            control_radius: 100000.0         # R: max control magnitude
            max_constraints: 2
            constraint_mode: "topk"
        # Mode: CBF solved via QP.
        cbf_qp_nonlinear:
          base_exp_ident_suffix: "cbf_qp_nonlinear"
          num_phi: [4]  # Ablation study
          cbf:
            use: true
            mode: "estimated"
            dt: 1.0
            k: 1.0
            control_radius: 100000.0         # R: max control magnitude
            max_constraints: 4
            constraint_mode: "qp"
        # Mode 4: Nonlinear CBF with merge strategy (only mode where kappa is used)
        cbf_merge_nonlinear:
          base_exp_ident_suffix: "cbf_merge_nonlinear"
          num_phi: [4]  # Ablation study
          cbf:
            use: true
            mode: "estimated"
            dt: 1.0
            k: 1.0
            kappa: 100.0          # kappa only matters when constraint_mode == "merge"
            control_radius: 100000.0
            constraint_mode: "merge"

        # Base model (no polytope, no defense, no CBF - original model only)
        # base_model:
        #   base_exp_ident_suffix: "base_model"
        #   polytope_model_path: ""  # Empty string means use base model without polytope
        # defense_smoothllm:
        #   base_exp_ident_suffix: "defense_smoothllm"
        #   defense:
        #     use: true
        #     method: "smoothllm"
        # ActAdd (Activation Addition) baseline - steer toward safety with x + α*r
        # actadd:
        #   base_exp_ident_suffix: "actadd"
        #   steering_vector:
        #     use: true
        #     method: "actadd"
        #     alpha: 1.0
        # # DirAblate (Directional Ablation) baseline - project out harmful direction
        # dirablate:
        #   base_exp_ident_suffix: "dirablate"
        #   steering_vector:
        #     use: true
        #     method: "dirablate"
        actadd:
          base_exp_ident_suffix: "actadd"
          steering_vector:
            use: true
            method: "actadd"
            alpha: 1.0
        dirablate:
          base_exp_ident_suffix: "dirablate"
          steering_vector:
            use: true
            method: "dirablate"
        circuit_breaker:
          base_exp_ident_suffix: "circuit_breaker"
          num_phi: [0]
          circuit_breaker:
            use: true
            training_mode: "circuit_breaker"
      generation_seed: [42, 43, 44]
      evaluation_methods: ["AutoDAN", "HumanJailbreaks", "PEZ", "GBDA", "DirectRequest", "AutoPrompt", "GCG", "UAT", "PAP-top5"]
    polytope_training:
      base_output_dir: "${WORKSPACE_ROOT}/outputs/harmbench/llama2_7b"
      dataset:
        hidden_states_path: "hs_data/harmbench/llama2_7b"
      num_epochs: 1
      learning_rate: 0.01
      batch_size: 512
      entropy_weight: 1.0
      lambda_constraint: 1.0
      log_interval: 500
      phi_l1_weight: 1.0
      modes:
        # Mode 1: SAP mode - nonlinear feature extractor without neural phi
        sap:
          base_exp_ident_suffix: "sap"
          num_phi: [30]  # Ablation study: test multiple num_phi values
          use_neural_phi: false
          use_nonlinear: true
          feature_dim: 16384
          safe_margin: 60.0
          unsafe_margin: 60.0
          unsafe_weight: 2.0
        # # Mode 2: CBF with nonlinear phi (neural network) - topk strategy
        cbf_topk_nonlinear:
          base_exp_ident_suffix: "cbf_topk_nonlinear"
          num_phi: [4]  # Ablation study: test multiple num_phi values
          use_neural_phi: true
          use_nonlinear: false
          neural_phi_architecture: separate_networks
          neural_phi_hidden_dims: [2048, 1024, 512, 256]
          lambda_constraint: 0.0  # f_l1_weight=0: features=hidden_states (fixed data, no effect)
          desc_loss_weight: 0.0      # Weight for L_desc term
          control_radius: 10000.0         # R: max control magnitude
          cbf_k: 1.0                  # k: CBF safety rate parameter
          safe_margin: 0.0    # Target: b(x) >= safe_margin
          unsafe_margin: 0.5  # Target: b(x) <= -unsafe_margin
          unsafe_weight: 8.0
          # neural_phi_final_activation: "tanh"
        # Mode 3: CBF-QP (no top-k / merge) reusing the nonlinear CBF weights.
        cbf_qp_nonlinear:
          base_exp_ident_suffix: "cbf_qp_nonlinear"
          num_phi: [4]  # Ablation study
          reuse_weights_from: "cbf_topk_nonlinear"

        cbf_merge_nonlinear:
          base_exp_ident_suffix: "cbf_merge_nonlinear"
          num_phi: [4]  # Ablation study
          reuse_weights_from: "cbf_topk_nonlinear"  # Reuse weights from this mode
        
        ### small CBF
        # cbf_topk_nonlinear_small_test:
        #   base_exp_ident_suffix: "cbf_topk_nonlinear_small_test"
        #   num_phi: [4]  # Ablation study: test multiple num_phi values
        #   use_neural_phi: true
        #   use_nonlinear: false
        #   neural_phi_architecture: separate_networks
        #   neural_phi_hidden_dims: [512, 256, 32, 16]
        #   lambda_constraint: 0.0  # f_l1_weight=0: features=hidden_states (fixed data, no effect)
        #   desc_loss_weight: 0.0      # Weight for L_desc term
        #   control_radius: 10000.0         # R: max control magnitude
        #   cbf_k: 1.0                  # k: CBF safety rate parameter
        #   safe_margin: 0.0    # Target: b(x) >= safe_margin
        #   unsafe_margin: 0.5  # Target: b(x) <= -unsafe_margin
        #   unsafe_weight: 10.0
        # # Mode 3: CBF-QP (no top-k / merge) reusing the nonlinear CBF weights.
        # cbf_qp_nonlinear_small:
        #   base_exp_ident_suffix: "cbf_qp_nonlinear_small"
        #   num_phi: [4]  # Ablation study
        #   reuse_weights_from: "cbf_topk_nonlinear_small"
          
        # # # Mode 5: Nonlinear CBF with merge strategy (reuse weights from cbf_topk_nonlinear)
        # cbf_merge_nonlinear_small:
        #   base_exp_ident_suffix: "cbf_merge_nonlinear_small"
        #   num_phi: [4]  # Ablation study
        #   reuse_weights_from: "cbf_topk_nonlinear_small"  # Reuse weights from this mode
        
        # # ActAdd (Activation Addition) baseline
        # actadd:
        #   base_exp_ident_suffix: "actadd"
        #   model_type: "steering_vector"
        #   steering_method: "actadd"
        #   steering_alpha: 1.0
        #   steering_normalize: false
        # # DirAblate (Directional Ablation) baseline
        # dirablate:
        #   base_exp_ident_suffix: "dirablate"
        #   model_type: "steering_vector"
        #   steering_method: "dirablate"
        #   steering_normalize: false

        # Mode 6: Per-attack CBF training with descent loss
        # cbf_per_attack:
        #   base_exp_ident_suffix: "cbf_per_attack"
        #   num_phi: [1]  # Single constraint per attack type
        #   use_neural_phi: true
        #   use_nonlinear: false
        #   neural_phi_architecture: separate_networks
        #   neural_phi_hidden_dims: [32]
        #   neural_phi_final_activation: null  # Options: null, "tanh", "softsign"
        #   lambda_constraint: 0.0
        #   entropy_weight: 0.0  # No diversity needed for single constraint per attack
        #   # Descent loss parameters
        #   desc_loss_weight: 0.0      # Weight for L_desc term
        #   control_radius: 10000.0         # R: max control magnitude
        #   cbf_k: 1.0                  # k: CBF safety rate parameter
        #   # Per-attack training configuration
        #   per_attack_training: true
        #   attack_types_to_train: ["AutoDAN", "HumanJailbreaks", "PEZ", "GBDA", "DirectRequest", "AutoPrompt", "GCG", "UAT", "PAP-top5"]
        actadd:
          base_exp_ident_suffix: "actadd"
          model_type: "steering_vector"
          steering_method: "actadd"
          steering_alpha: 1.0
          steering_normalize: false
        dirablate:
          base_exp_ident_suffix: "dirablate"
          model_type: "steering_vector"
          steering_method: "dirablate"
          steering_normalize: false
        circuit_breaker:
          model_type: "circuit_breaker"
          base_exp_ident_suffix: "circuit_breaker"
          base_output_dir: "${WORKSPACE_ROOT}/outputs/harmbench_cb/llama2_7b"
          behavior_dataset: "data/behavior_datasets/harmbench_behaviors_text_val.csv"
          target_layers: "20"
          transform_layers: "-1"
          lorra_alpha: 10.0
          lora_r: 16
          lora_alpha: 16
          lora_dropout: 0.05
          learning_rate: 1e-4
          weight_decay: 0.0
          max_steps: 150
          per_device_train_batch_size: 8
          gradient_accumulation_steps: 1
          schedule_steps: 300
          max_length: 1024
          bf16: true
          gradient_checkpointing: true
          val_fraction: 0.1
    attack_methods: ["AutoDAN", "HumanJailbreaks", "PEZ", "GBDA", "DirectRequest", "AutoPrompt", "GCG", "UAT", "PAP-top5"]
