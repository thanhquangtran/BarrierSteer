# Slurm configuration
slurm:
  partition: "gpu"
  time_limit: "24:00:00"
  job_timeout_minutes: 240  # How long to wait for jobs to complete
  check_interval_seconds: 60  # How often to check job status

# Attack generation settings (Stage 1 - Complete HarmBench Pipeline)
# Generate test cases for all behaviors (400 = test + val), then filter by dataset for training/evaluation
attack_generation:
  behavior_dataset: "./data/behavior_datasets/harmbench_behaviors_text_all.csv"  # Generate test cases for all behaviors
  execution_mode: "local_parallel"  # Mode for run_pipeline.py
  overwrite: false  # If true, overwrite existing test cases. If false, skip existing test cases.
  reverse: false # whether to process behaviors in reverse order (useful for multi-node generation)

# Hidden state extraction settings
hidden_state_extraction:
  layer_number: 20
  part_size: null
  max_new_tokens: 128
  execution_mode: "local_parallel"  # or "slurm" - use local for testing
  training_behavior_dataset: "./data/behavior_datasets/harmbench_behaviors_text_test.csv"  # Filter behaviors for training (test set)
  overwrite: true

# Polytope training configuration
polytope_training:
  seed: 42
  num_phi: 30
  learning_rate: 0.01
  entropy_weight: 1.0
  unsafe_weight: 2.0
  margin: 1.0
  execution_mode: "local_parallel"  # "local", "local_parallel" (auto-detects all GPUs, 1 job per GPU), or "slurm"
  dataset:
    use_category_data: false
    
# Steering evaluation configuration
steering_evaluation:
  part_size: 80
  execution_mode: "local_parallel"  # "local", "local_parallel" (multi-GPU by parts), or "slurm"
  # evaluation_test_case_model is no longer needed since we generate test cases for all behaviors in one run
  # The evaluation will use all test cases from the main model_name
  # vLLM memory settings (for classifier model loading)
  vllm_gpu_memory_utilization: 0.7  # Use 70% of GPU memory (default: 0.9)
  vllm_enforce_eager: true  # Disable CUDA graphs to save memory (default: false)
  vllm_max_num_seqs: 64  # Max concurrent sequences (default: 256)

# Evaluation configuration
evaluation:
  cls_path: "cais/HarmBench-Llama-2-13b-cls"
  behavior_dataset: "./data/behavior_datasets/harmbench_behaviors_text_val.csv"
  # NOTE: This is only used for metadata. Actual test cases come from Stage 1.
  include_advbench_metric: true

# Logging configuration
logging:
  level: "INFO"
  log_dir: "./logs/harmbench_pipeline"
